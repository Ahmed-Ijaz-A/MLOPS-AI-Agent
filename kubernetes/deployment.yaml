apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops-agent
  labels:
    app.kubernetes.io/name: inference-api
    app.kubernetes.io/part-of: mlops-agent
    app.kubernetes.io/component: model-server
    app.kubernetes.io/version: model-v1
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below desired capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-api
        app.kubernetes.io/part-of: mlops-agent
      annotations:
        # Model provenance - written by scripts/deploy_model.py, read by k8s_get_deployed_version.
        mlops.agent/model-name: credit-risk-classifier
        mlops.agent/model-version: "1"
        mlops.agent/model-run-id: ""
        mlops.agent/dataset-version: ""
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-api
          image: mlops-inference:model-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inference-config
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
