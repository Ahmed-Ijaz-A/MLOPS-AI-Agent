# Local MLOps platform: MLflow tracking server + Apache Airflow 3 (LocalExecutor, Postgres).
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
# MLflow  -> http://localhost:5000
# Airflow -> http://localhost:8080   (user/password from AIRFLOW_USERNAME / AIRFLOW_PASSWORD in .env)
#
# The repository is bind-mounted at /opt/project so the DAG trains on the exact DVC-tracked data and
# records the real git commit / dataset md5 in MLflow.

x-airflow-common: &airflow-common
  build: ./airflow
  image: mlops-airflow:3.1.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_USERNAME:-airflow}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-change-me-local-dev-only}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_JWT_SECRET:-change-me-local-dev-only}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PROJECT_DIR: /opt/project
    PYTHONPATH: /opt/project
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_EXPERIMENT_NAME: credit-risk-classification
    MLFLOW_REGISTERED_MODEL: credit-risk-classifier
    GIT_PYTHON_REFRESH: quiet
  volumes:
    - ../dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - airflow-config:/opt/airflow/config
    - ..:/opt/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mlflow:
    build: ./mlflow
    image: mlops-mlflow:3.18.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/config
        printf '{"%s": "%s"}' "$${AIRFLOW_USERNAME}" "$${AIRFLOW_PASSWORD}" > /opt/airflow/config/passwords.json
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config
        exec /entrypoint airflow db migrate
    environment:
      <<: *airflow-env
      AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:-airflow}"
      AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:?set AIRFLOW_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  mlflow-data:
  airflow-config:
