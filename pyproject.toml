[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "1.0.0"
description = "Production-ready MLOps AI agent: evidence-grounded tool use over DVC, MLflow, Airflow 3 and Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.40",           # Gemini via its OpenAI-compatible endpoint
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "mlflow>=2.16",
    "dvc>=3.50",
    "kubernetes>=30.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
mlops-agent = "agent.main:cli"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*", "serving*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "mlruns", "artifacts", "infra/airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "E501",   # layout is enforced by `ruff format`; long f-strings are intentional
    "S603",   # subprocess calls are allow-listed explicitly in agent/safety.py
    "S607",
    "B008",   # FastAPI Depends()
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires live services (MLflow/Airflow/Kubernetes); skipped in CI",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["agent", "api", "training", "serving"]
omit = ["*/__init__.py"]
